# Builds scrollable-waypoints.dll on Windows (MSVC, x64, Release) and uploads it as an artifact.
# Download it from the run's page: Actions tab -> the run -> "Artifacts" -> scrollable-waypoints-dll.
# A pushed tag v<version> (matching PluginVersion in plugin/src/plugin.cpp) also publishes a GitHub Release with the
# DLL, its SHA-256 and that version's CHANGELOG.md section.
name: Build DLL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # D2RLoader PluginSDK 0.3.0 (D2RLoader 1.3.1): the SDK this plugin was written against.
  PLUGIN_SDK_REF: 717f727a0ec52912d1558764345f8fa3453a2bd6

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Iplugin/src plugin/tests/wp_logic_test.cpp -o wp_test
          ./wp_test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out D2RLoader PluginSDK
        uses: actions/checkout@v4
        with:
          repository: D2RLoader/PluginSDK
          ref: ${{ env.PLUGIN_SDK_REF }}
          path: PluginSDK

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File plugin\build.ps1 -Sdk "$env:GITHUB_WORKSPACE\PluginSDK"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: scrollable-waypoints-dll
          path: plugin/build/Release/scrollable-waypoints.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [logic-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/.*PluginVersion = "\([^"]*\)".*/\1/p' plugin/src/plugin.cpp)
          echo "tag $tag, plugin $version"
          [ "$tag" = "$version" ] || { echo "::error::tag v$tag does not match PluginVersion $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: scrollable-waypoints-dll
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum scrollable-waypoints.dll > scrollable-waypoints.dll.sha256
          # this version's CHANGELOG section (from its heading to the next one)
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          printf '\n**Install:** close the game, copy `scrollable-waypoints.dll` into `<game folder>\\d2rloader\\plugins\\`, start the game through D2RLoader. Built on D2R 3.3.0 build 93847 with D2RLoader 1.3.1.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" scrollable-waypoints.dll scrollable-waypoints.dll.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Scrollable Waypoints $version" --notes-file notes.md
