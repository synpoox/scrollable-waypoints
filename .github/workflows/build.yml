# Builds scrollable-waypoints.dll on Windows (MSVC, x64, Release) and uploads it as an artifact.
# Download it from the run's page: Actions tab -> the run -> "Artifacts" -> scrollable-waypoints-dll.
# Publishing a release (DLL, its SHA-256 and that version's CHANGELOG.md section), either way:
#  - Actions tab -> Build DLL -> Run workflow on main, with "publish" ticked: tags v<PluginVersion> and releases it;
#  - or push a tag v<version> matching PluginVersion in plugin/src/plugin.cpp.
name: Build DLL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release: tag v<PluginVersion> on this commit (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # D2RLoader PluginSDK 0.3.0 (D2RLoader 1.3.1): the SDK this plugin was written against.
  PLUGIN_SDK_REF: 717f727a0ec52912d1558764345f8fa3453a2bd6

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Iplugin/src plugin/tests/wp_logic_test.cpp -o wp_test
          ./wp_test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out D2RLoader PluginSDK
        uses: actions/checkout@v4
        with:
          repository: D2RLoader/PluginSDK
          ref: ${{ env.PLUGIN_SDK_REF }}
          path: PluginSDK

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File plugin\build.ps1 -Sdk "$env:GITHUB_WORKSPACE\PluginSDK"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: scrollable-waypoints-dll
          path: plugin/build/Release/scrollable-waypoints.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [logic-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and tag
        id: version
        run: |
          version=$(sed -n 's/.*PluginVersion = "\([^"]*\)".*/\1/p' plugin/src/plugin.cpp)
          [ -n "$version" ] || { echo "::error::PluginVersion not found in plugin/src/plugin.cpp"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match PluginVersion $version"; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::publish releases from main, not $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: scrollable-waypoints-dll
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists: bump PluginVersion and add a CHANGELOG.md section first"; exit 1
          fi
          cd dist
          sha256sum scrollable-waypoints.dll > scrollable-waypoints.dll.sha256
          # this version's CHANGELOG section (from its heading to the next one)
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          printf '\n**Install:** close the game, copy `scrollable-waypoints.dll` into `<game folder>\\d2rloader\\plugins\\`, start the game through D2RLoader. Built on D2R 3.3.0 build 93847 with D2RLoader 1.3.1.\n' >> notes.md
          # --target: when the tag does not exist yet (Run workflow), it is created on the commit that was built
          gh release create "$TAG" scrollable-waypoints.dll scrollable-waypoints.dll.sha256 --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Scrollable Waypoints $VERSION" --notes-file notes.md
